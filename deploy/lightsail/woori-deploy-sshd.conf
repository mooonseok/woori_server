# /etc/ssh/sshd_config.d/woori-deploy.conf (root 0644). Server-side limits for
# the woori-deploy user on top of the restrict,command= options of its key
# (deploy/lightsail/woori-deploy.sh): only the forced command, the key list in
# a root-owned file the user cannot edit, and on the API host only a local
# forward to the worker's SSH (the runner's ProxyJump). No remote (-R)
# forwards, agent, X11, TTY or Unix sockets: authorized_keys options alone
# cannot forbid -R once port-forwarding is enabled.
# Install (API host), filling in the worker's private IP:
#   sed 's/WORKER_PRIVATE_IP/172.26.1.167/' deploy/lightsail/woori-deploy-sshd.conf \
#     > /etc/ssh/sshd_config.d/woori-deploy.conf
#   ! grep -q WORKER_PRIVATE_IP /etc/ssh/sshd_config.d/woori-deploy.conf
#   sshd -t && systemctl reload ssh
# On the worker host set AllowTcpForwarding no and drop the PermitOpen line.
# Undo: delete the file, `sshd -t`, reload.
Match User woori-deploy
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    ForceCommand sudo -n /usr/local/lib/woori/woori-deploy.sh ssh
    AllowTcpForwarding local
    PermitOpen WORKER_PRIVATE_IP:22
    PermitListen none
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTTY no
# Ends the Match block so later settings apply to everyone again.
Match all
